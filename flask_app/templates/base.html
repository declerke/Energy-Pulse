<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EnergyPulse{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>⚡ EnergyPulse</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/api/prices" target="_blank">API: Prices</a>
                <a href="/api/report" target="_blank">API: Report</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>EnergyPulse — Global Energy Price Intelligence Platform | Data: EIA International Energy Statistics</p>
    </footer>
</body>
</html>
