version: "3.9"

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
    AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "energy-pulse-jwt-secret-2026"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:Admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/auth/passwords.json"
    AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    MONGODB_URI: "mongodb://mongo:27017"
    DATABASE_NAME: "${DATABASE_NAME:-energy_pulse}"
    EIA_API_KEY: "${EIA_API_KEY}"
    PYTHONPATH: "/opt/airflow"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/auth:/opt/airflow/auth
    - ./app:/opt/airflow/app
    - ./config:/opt/airflow/config
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:

  mongo:
    image: mongo:7
    container_name: energy_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-db:
    image: postgres:15-alpine
    container_name: energy_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    container_name: energy_airflow_init
    command: ["airflow", "db", "migrate"]
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: energy_airflow_api_server
    command: ["airflow", "api-server", "--workers", "1"]
    ports:
      - "8080:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 60s
      timeout: 60s
      retries: 5
      start_period: 300s

  airflow-scheduler:
    <<: *airflow-common
    container_name: energy_airflow_scheduler
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--local"]
      interval: 60s
      timeout: 60s
      retries: 5
      start_period: 300s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: energy_airflow_dag_processor
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: energy_airflow_triggerer
    command: ["airflow", "triggerer"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: energy_flask
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: "mongodb://mongo:27017"
      DATABASE_NAME: "${DATABASE_NAME:-energy_pulse}"
      EIA_API_KEY: "${EIA_API_KEY}"
      FLASK_ENV: "production"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
  airflow_db_data:
  airflow_logs:
